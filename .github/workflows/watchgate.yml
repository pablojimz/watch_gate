name: WatchGate
on:
  pull_request:
    types: [opened, synchronize]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      # Checkout mínimo, solo para que `uses: ./` pueda resolver el propio
      # action.yml de este repo -- la Action hace su propio checkout
      # completo (fetch-depth: 0) como primer paso interno. Este es
      # exactamente el mismo flujo que seguiría un repo externo real con
      # `uses: pablojimz/watch_gate@main`, así que este workflow sirve de
      # dogfooding real de action.yml, no solo de la lógica interna.
      - uses: actions/checkout@v4
      - name: WatchGate
        uses: ./
        with:
          llm-api-key: ${{ secrets.WATCHGATE_LLM_API_KEY }}
