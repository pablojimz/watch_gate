name: CI

# Hasta ahora no había ningún workflow que corriera la suite de tests/lint
# en cada push/PR -- watchgate.yml analiza PRs de este propio repo con la
# herramienta (dogfooding), sync-rules.yml/reconcile-rules.yml sincronizan
# el árbol de reglas Semgrep/YARA, pero nada verificaba que el código
# propio compilase, pasara lint o tests antes de fusionarse. Este workflow
# cierra ese hueco: espejo exacto de `make lint`/`make test` (ver
# Makefile), para que un fallo local siempre se reproduzca aquí y
# viceversa.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Liberar espacio en disco en el runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar Poetry
        run: pip install poetry

      - name: Cachear el entorno virtual de Poetry
        uses: actions/cache@v4
        with:
          path: .venv
          key: poetry-${{ runner.os }}-${{ hashFiles('poetry.lock') }}

      - name: Instalar dependencias (poetry install)
        run: |
          poetry config virtualenvs.in-project true
          poetry install --no-interaction --all-extras

      # Espejo exacto de `make lint` -- si esto pasa en local, pasa aquí, y
      # viceversa. No incluye la suite de aceptación real (tests/integration/
      # test_cases.py, marcada `integration`): llama a la API real de Gemini,
      # cuesta dinero y tiempo, y ya está deseleccionada por defecto en
      # pyproject.toml (`addopts = "-m 'not integration'"`) -- se ejecuta
      # aparte, a mano, no en cada push.
      - name: Lint (ruff check + ruff format --check + mypy + import-linter)
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy
          poetry run lint-imports

      - name: Tests (pytest --cov)
        run: poetry run python -m pytest --cov --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: watchgate/dashboard/frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: watchgate/dashboard/frontend/package-lock.json

      - run: npm ci

      # Vitest + Testing Library cubren los flujos de frontend con mayor
      # riesgo silencioso -- borrado de repos externos, cambio de
      # contraseña, alta de usuarios -- donde un handler roto o una
      # validación que no bloquea el submit compilan perfectamente en
      # TypeScript pero fallan en runtime. `--run` en vez del modo watch
      # por defecto de `vitest`: en CI el proceso debe terminar solo, no
      # quedarse esperando cambios de fichero.
      - run: npm run test:run

      # `build` ejercita además `tsc -b` (typecheck estricto) + el build
      # real de Vite, detectando errores de tipos/compilación que los tests
      # unitarios de arriba no cubren.
      - run: npm run build

  postgres-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: watchgate
          POSTGRES_PASSWORD: watchgate_password
          POSTGRES_DB: watchgate_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install poetry
      - run: poetry install --no-interaction
      - name: Run pytest on PostgreSQL
        env:
          WATCHGATE_DASHBOARD_DATABASE_URL: postgresql://watchgate:watchgate_password@localhost:5432/watchgate_test
        run: poetry run python -m pytest tests/integration/test_dashboard_postgres.py

  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Liberar espacio en disco en el runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
      - name: Build Docker Image
        run: docker build -f docker/engine-api.Dockerfile -t watchgate-engine:latest .
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'watchgate-engine:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          scanners: 'vuln'
          timeout: '15m'
          severity: 'CRITICAL,HIGH'
