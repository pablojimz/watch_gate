# Escaneo de vulnerabilidades de la imagen Docker del engine con Trivy.
#
# Antes era un job de ci.yml que corría en CADA push y CADA PR: construir la
# imagen (torch dentro, varios GB) cuesta 15-20 min de runner, y el escaneo
# es informativo (exit-code 0, nunca bloquea). Aquí corre solo cuando puede
# cambiar el resultado: semanalmente (para CVEs nuevas publicadas sobre las
# mismas dependencias), a mano, o en PRs que tocan los Dockerfiles o las
# dependencias Python.
name: Trivy scan

on:
  schedule:
    # Domingos 04:00 UTC -- fuera de horario, una vez por semana.
    - cron: "0 4 * * 0"
  workflow_dispatch: {}
  pull_request:
    paths:
      - "docker/**"
      - "poetry.lock"
      - "pyproject.toml"

concurrency:
  group: trivy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  trivy-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Liberar espacio en disco en el runner
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
      - name: Build Docker Image
        run: docker build -f docker/engine-api.Dockerfile -t watchgate-engine:latest .
      - name: Scan Docker Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'watchgate-engine:latest'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          scanners: 'vuln'
          timeout: '15m'
          severity: 'CRITICAL,HIGH'
