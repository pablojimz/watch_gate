[project]
name = "watchgate"
version = "0.1.0"
description = "Sistema de scoring de riesgo para la revisión automatizada de pull requests en pipelines CI/CD"
authors = [
  { name = "Javier Martín Jurado" },
  { name = "Pablo Jiménez Castro" },
  { name = "Pablo Ayllón García" },
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "GitPython==3.1.*",
  "httpx>=0.27,<1",
  "rapidfuzz>=3.9,<4",
  "jinja2>=3.1,<4",
  "python-json-logger>=2.0,<3",
  "semgrep>=1.78,<2",
  "yara-python>=4.5,<5",
  "chromadb>=0.5,<1",
  "sentence-transformers>=3.0,<4",
  "langchain-text-splitters>=0.2,<1",
  "anthropic>=0.30,<1",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.30,<1",
  "python-jose[cryptography]>=3.3,<4",
  "authlib>=1.3,<2",
  "itsdangerous>=2.2,<3",
]

[project.scripts]
watchgate = "watchgate.cli:main"

[tool.poetry]
packages = [{ include = "watchgate" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.5"
mypy = "^1.10"
import-linter = "^2.0"

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ contiene la memoria y la spec de implementación (markdown de referencia
# externa, con bloques de código pedagógicos) -- nunca se lintea ni se reformatea.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: mantenemos (str, Enum) en vez de enum.StrEnum -- es el patrón exacto
# de models.py §1 y el que pydantic documenta para serializar como string.
ignore = ["UP042"]

[tool.mypy]
strict = true
files = ["watchgate/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["watchgate/core"]

[tool.importlinter]
root_package = "watchgate"

[[tool.importlinter.contracts]]
name = "Layers"
type = "forbidden"
source_modules = ["watchgate.core"]
forbidden_modules = ["watchgate.adapters", "watchgate.dashboard"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
