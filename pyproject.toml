[project]
name = "watchgate"
version = "0.1.0"
description = "Sistema de scoring de riesgo para la revisión automatizada de pull requests en pipelines CI/CD"
authors = [
  { name = "Javier Martín Jurado" },
  { name = "Pablo Jiménez Castro" },
  { name = "Pablo Ayllón García" },
]
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
keywords = ["security", "code-review", "pull-request", "static-analysis", "llm", "supply-chain"]
dependencies = [
  "pydantic>=2.13.5,<3",
  "pydantic-settings>=2.3,<3",
  "GitPython==3.1.*",
  "httpx>=0.27,<1",
  "rapidfuzz>=3.9,<4",
  "jinja2>=3.1,<4",
  "python-json-logger>=2.0,<3",
  "fastapi>=0.111,<1",
  "uvicorn[standard]>=0.52.4,<1",
  "python-jose[cryptography]>=3.3,<4",
  "authlib>=1.3,<2",
  "itsdangerous>=2.2,<3",
  # Persistencia unificada de BD (SQLModel/SQLAlchemy) y parseo seguro de diffs HTTP (unidiff)
  "sqlmodel>=0.0.19,<1",
  "unidiff>=0.7,<1",
  "psycopg[binary] (>=3.1,<4.0)",
  # CLI UX y autocompletado
  "rich>=13.0,<14",
  "argcomplete>=3.0,<4",
  "tiktoken (>=0.13.0,<0.14.0)",
  "alembic (>=1.19.1,<2.0.0)",
  "redis (>=8.1.0,<9.0.0)",
  "rq (>=2.11,<3.0)",
  "sentry-sdk (>=2.68.1,<3.0.0)",
]

# Extra "analysis": lo que de verdad hace pesada la imagen (~1.5 GB, sobre
# todo sentence-transformers/torch) -- solo lo necesita quien ejecuta el
# pipeline de análisis de verdad (CLI, Engine API, adaptador de GitHub
# Action, capas de core/layers/). El backend del Dashboard (login,
# histórico, settings, API keys) nunca importa core.layers/core.pipeline/
# core.rag ni la capa semántica -- verificado por grep antes de separar
# esto, no es una suposición -- así que puede instalarse sin este extra y
# ahorrarse el peso entero. `poetry install`/CI siguen instalando TODO por
# defecto (ver `--all-extras` en Makefile/ci.yml): esta separación es solo
# para elegir qué entra en cada imagen Docker
# (docker/dashboard-backend.Dockerfile la omite a propósito).
[project.optional-dependencies]
analysis = [
  "semgrep>=1.78,<2",
  "yara-python>=4.5,<5",
  "chromadb>=0.5,<1",
  # >=6.0: sentence-transformers 3.x-5.x fijan transformers<5.0.0; 6.0 es la
  # primera versión que sube ese tope a transformers>=5.0,<6.0 -- necesario
  # para corregir CVE-2026-4372/CVE-2026-5241 (RCE/ejecución de código
  # arbitrario) en transformers 4.57.6, que sin este bump quedaría fijado
  # de forma transitiva sin fix disponible. Ver el commit que introdujo
  # este bump para el análisis de exposición y la verificación hecha
  # (tests/unit/test_rag*.py, test_semantic_layer.py -- la única superficie
  # de este paquete en el repo es `SentenceTransformer(EMBEDDING_MODEL_NAME)
  # .encode(...)` en watchgate/core/rag/retriever.py, con un nombre de
  # modelo fijo -- nunca definido por el usuario ni por el diff analizado).
  "sentence-transformers>=6.0,<7",
  "langchain-text-splitters>=0.2,<1",
  "anthropic>=0.125.0,<1",
  "google-genai>=2.20.0,<3",
  # Fronteras de función/clase + imports vía AST para trocear ficheros
  # grandes en la capa semántica sin partir código a mitad de una
  # construcción (ver `_semantic/ast_boundaries.py`/`chunking.py`). Python
  # usa el `ast` de la stdlib (sin dependencia); estas dos cubren el resto
  # de lenguajes (JS/TS, Go, Rust, Java, Ruby, C/C++, bash) con grammars
  # precompiladas, sin toolchain de compilación en la imagen.
  "tree-sitter>=0.23,<1",
  "tree-sitter-language-pack>=0.2,<1",
]

[project.urls]
Repository = "https://github.com/pablojimz/watch_gate"
Issues = "https://github.com/pablojimz/watch_gate/issues"

[project.scripts]
watchgate = "watchgate.cli:main"

[tool.poetry]
packages = [{ include = "watchgate" }]

[tool.poetry.group.dev.dependencies]
pytest = "^9.1"
pytest-cov = "^7.1"
ruff = "^0.16"
mypy = "^2.3"
import-linter = "^2.0"
fakeredis = "^2.37.1"

# Subconjunto de las capas estáticas (Semgrep, YARA, diffparser vía
# GitPython) para el Dockerfile de la GitHub Action (raíz del repo), que NO
# debe empaquetar la capa semántica/RAG (chromadb/sentence-transformers/
# torch, ~1.5 GB) -- esa capa se llama vía HTTP a un endpoint centralizado.
# Grupo aparte y opcional para no tocar el grupo "main" (del que depende
# `poetry install --only main` en docker/engine-api.Dockerfile, que sí
# necesita el proyecto completo incluida la capa semántica).
[tool.poetry.group.static]
optional = true

[tool.poetry.group.static.dependencies]
GitPython = "3.1.*"
semgrep = ">=1.175.0,<2"
yara-python = ">=4.5,<5"

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ contiene la memoria y la spec de implementación (markdown de referencia
# externa, con bloques de código pedagógicos) -- nunca se lintea ni se reformatea.
# tests/cases/ contiene fixtures reales bajados tal cual de otros proyectos
# (click, jinja, requests...) para la suite de aceptación §14 -- no es código
# propio, no se lintea.
# rules/ es el árbol de reglas Semgrep/YARA sincronizado desde el repo
# privado de reglas (ver docs/integracion_repo_reglas.md) -- incluye
# fixtures de test de terceros con sintaxis de patrón Semgrep (no Python
# real, aunque tengan extensión .py), que sin excluir producían ~840 falsos
# positivos de "nombre no definido" y ahogaban cualquier señal real de
# `ruff check .` sobre el código propio del proyecto.
# alembic/versions/ son migraciones generadas por
# `alembic revision --autogenerate` con el estilo propio de Alembic
# (imports sin ordenar, Union en vez de X | Y...) -- se generan así en
# cada `autogenerate` futuro, no tiene sentido reformatearlas a mano cada
# vez. alembic/script.py.mako ni siquiera es Python (plantilla Mako).
# alembic/env.py sí es código propio y sí se lintea. Mismo criterio para
# alembic_dashboard/ (segundo entorno Alembic, esquema del Dashboard DB --
# ver watchgate/dashboard/backend/models.py).
extend-exclude = [
  "docs",
  "tests/cases",
  "rules",
  "alembic/versions",
  "alembic/script.py.mako",
  "alembic_dashboard/versions",
  "alembic_dashboard/script.py.mako",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: mantenemos (str, Enum) en vez de enum.StrEnum -- es el patrón exacto
# de models.py §1 y el que pydantic documenta para serializar como string.
ignore = ["UP042"]

[tool.ruff.lint.per-file-ignores]
# SYSTEM_PROMPT es el texto literal exacto de la spec §7.1; no se envuelve.
"watchgate/core/layers/_semantic/prompting.py" = ["E501"]

[tool.mypy]
strict = true
files = ["watchgate"]

[[tool.mypy.overrides]]
# Librerías externas sin marcador py.typed o stubs globales.
module = ["google.*", "yaml", "chromadb", "sentence_transformers", "langchain_text_splitters.*", "anthropic", "unidiff", "unidiff.*", "argcomplete", "rich.*", "yara", "psycopg", "psycopg.*", "jose", "jose.*", "authlib.*", "tiktoken", "tiktoken.*", "pythonjsonlogger", "pythonjsonlogger.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
# El proyecto vive en ~/Desktop (iCloud), que a veces vuelve a marcar los .pth
# del venv como "hidden" (flag de BSD) tras el editable install; Python 3.11+
# los ignora en ese caso. `pythonpath` hace que pytest encuentre el paquete
# sin depender de ese mecanismo.
pythonpath = ["."]
filterwarnings = [
    "ignore::DeprecationWarning:chromadb.*",
    "ignore::DeprecationWarning:starlette.*",
    "ignore::DeprecationWarning:fastapi.*",
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore::pydantic.warnings.PydanticDeprecatedSince211",
    "ignore::pydantic.warnings.ArbitraryTypeWarning",
]
markers = [
    "integration: suite de aceptación end-to-end (spec §14) -- llama a la API real de Gemini, no corre con `pytest -q` por defecto.",
]
# La suite de integración cuesta dinero y tiempo real (llamadas a Gemini); se
# deselecciona por defecto y se invoca explícitamente con `-m integration`.
# --ignore=tests/cases: los fixtures de la suite de aceptación incluyen ficheros
# reales `test_*.py` de otros proyectos (click, jinja...) tal cual se bajaron de
# GitHub -- sin el --ignore, pytest intenta coleccionarlos como si fueran tests
# propios y falla al importarlos (dependen de entornos que no son el nuestro).
addopts = "-m 'not integration' --ignore=tests/cases"

[tool.coverage.run]
source = ["watchgate/core"]

[tool.importlinter]
root_package = "watchgate"

[[tool.importlinter.contracts]]
name = "Layers"
type = "forbidden"
source_modules = ["watchgate.core"]
forbidden_modules = ["watchgate.adapters", "watchgate.dashboard"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
