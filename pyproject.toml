[tool.poetry]
name = "watchgate"
version = "0.1.0"
description = "Sistema de scoring de riesgo para la revisión automatizada de pull requests en pipelines CI/CD"
authors = [
  "Javier Martín Jurado",
  "Pablo Jiménez Castro",
  "Pablo Ayllón García",
]
readme = "README.md"
packages = [{ include = "watchgate" }]

[tool.poetry.dependencies]
python = "^3.11"
pydantic = "^2.7"
pydantic-settings = "^2.3"
GitPython = "3.1.*"
httpx = "^0.27"
rapidfuzz = "^3.9"
jinja2 = "^3.1"
python-json-logger = "^2.0"
semgrep = "^1.78"
yara-python = "^4.5"
chromadb = "^0.5"
sentence-transformers = "^3.0"
langchain-text-splitters = "^0.2"
anthropic = "^0.30"
fastapi = "^0.111"
uvicorn = { extras = ["standard"], version = "^0.30" }
python-jose = { extras = ["cryptography"], version = "^3.3" }
authlib = "^1.3"
itsdangerous = "^2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2"
pytest-cov = "^5.0"
ruff = "^0.5"
mypy = "^1.10"
import-linter = "^2.0"

[tool.poetry.scripts]
watchgate = "watchgate.cli:main"

[tool.ruff]
line-length = 100
target-version = "py311"
# docs/ contiene la memoria y la spec de implementación (markdown de referencia
# externa, con bloques de código pedagógicos) -- nunca se lintea ni se reformatea.
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# UP042: mantenemos (str, Enum) en vez de enum.StrEnum -- es el patrón exacto
# de models.py §1 y el que pydantic documenta para serializar como string.
ignore = ["UP042"]

[tool.mypy]
strict = true
files = ["watchgate/core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.run]
source = ["watchgate/core"]

[tool.importlinter]
root_package = "watchgate"

[[tool.importlinter.contracts]]
name = "Layers"
type = "forbidden"
source_modules = ["watchgate.core"]
forbidden_modules = ["watchgate.adapters", "watchgate.dashboard"]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
