# Entorno Alembic del Dashboard DB -- segundo entorno, separado del de
# alembic.ini (que cubre watchgate/db/models.py, la Engine DB). Son dos
# bases de datos físicamente distintas (WATCHGATE_DASHBOARD_DATABASE_URL
# vs WATCHGATE_DATABASE_URL); un único historial de migraciones compartido
# mezclaría el esquema de una dentro de la otra. Uso:
#   alembic -c alembic_dashboard.ini upgrade head
#   alembic -c alembic_dashboard.ini stamp head   (una vez, en despliegues
#     existentes que ya tenían estas tablas antes de adoptar Alembic aquí)

[alembic]
script_location = %(here)s/alembic_dashboard

prepend_sys_path = .

path_separator = os

# Placeholder -- alembic_dashboard/env.py la sobreescribe siempre con
# watchgate.dashboard.backend.db._database_url(None) (WATCHGATE_DASHBOARD_DATABASE_URL
# o el SQLite por defecto), para no mantener la URL sincronizada en dos sitios.
sqlalchemy.url = driver://user:pass@localhost/dbname


[post_write_hooks]

# Logging configuration.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
