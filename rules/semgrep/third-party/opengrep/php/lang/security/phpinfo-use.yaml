rules:
- id: phpinfo-use
  pattern: phpinfo(...);
  message: >-
    The 'phpinfo' function may reveal sensitive information about your environment.
  metadata:
    cwe:
    - 'CWE-200: Exposure of Sensitive Information to an Unauthorized Actor'
    references:
    - https://www.php.net/manual/en/function.phpinfo
    - https://github.com/FloeDesignTechnologies/phpcs-security-audit/blob/master/Security/Sniffs/BadFunctions/PhpinfosSniff.php
    category: security
    technology:
    - php
    owasp:
    - A01:2021 - Broken Access Control
    cwe2021-top25: true
    subcategory:
    - vuln
    likelihood: MEDIUM
    impact: MEDIUM
    confidence: MEDIUM
    severity_score: 25
    confidence_score: 100
    exploitability_score: 80
    risk_score: 61
    risk_justification: Exposición de información de entorno; función exacta, sin vía de explotación directa.
    finding_type: vulnerability
  languages: [php]
  severity: ERROR
