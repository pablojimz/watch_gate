rules:
- id: plaintext-http-link
  metadata:
    category: security
    technology:
    - html
    cwe:
    - 'CWE-319: Cleartext Transmission of Sensitive Information'
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    confidence: HIGH
    subcategory:
    - vuln
    references:
    - https://cwe.mitre.org/data/definitions/319.html
    likelihood: LOW
    impact: LOW
    severity_score: 25
    confidence_score: 60
    exploitability_score: 80
    risk_score: 49
    risk_justification: Enlace http literal; no confirma que transporte datos sensibles.
  patterns:
  - pattern: <a href="$URL">...</a>
  - metavariable-regex:
      metavariable: $URL
      regex: '^(?i)http://'
  message: >-
    This link points to a plaintext HTTP URL. Prefer an encrypted HTTPS URL if possible.
  severity: WARNING
  languages: [html]
