rules:
- id: reverseproxy-director
  message: >-
    ReverseProxy can remove headers added by Director. Consider using ReverseProxy.Rewrite
    instead of ReverseProxy.Director.
  languages: [go]
  severity: WARNING
  patterns:
  - pattern-inside: |
      import "net/http/httputil"
      ...
  - pattern-either:
    - pattern: $PROXY.Director = $FUNC
    - patterns:
      - pattern-inside: |
          httputil.ReverseProxy{
              ...
          }
      - pattern: |
          Director: $FUNC
  metadata:
    cwe:
    - "CWE-115: Misinterpretation of Input"
    category: security
    subcategory:
    - audit
    technology:
    - go
    confidence: MEDIUM
    likelihood: LOW
    impact: LOW
    references:
    - https://github.com/golang/go/issues/50580
    severity_score: 25
    confidence_score: 30
    exploitability_score: 40
    risk_score: 30
    risk_justification: Uso de campo Director en ReverseProxy; patron estandar pre-Go1.20, mayoria de usos legitimos, riesgo indirecto de headers.
    finding_type: vulnerability
