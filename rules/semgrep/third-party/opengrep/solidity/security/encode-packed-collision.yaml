rules:
  - id: encode-packed-collision
    message: abi.encodePacked hash collision with variable length arguments in $F()
    metadata:
      category: security
      technology:
        - solidity
      cwe: "CWE-20: Improper Input Validation"
      confidence: HIGH
      likelihood: MEDIUM
      impact: MEDIUM
      subcategory:
        - vuln
      references:
        - https://swcregistry.io/docs/SWC-133
      severity_score: 75
      confidence_score: 80
      exploitability_score: 80
      risk_score: 78
      risk_justification: abi.encodePacked con args de longitud variable; colisión de hash puede romper lógica de auth/whitelist, llamable directamente.
    patterns:
      - pattern-either:
          - pattern-inside: |
              function $F(..., bytes $A, ..., bytes $B, ...) public {
                ...
              }
          - pattern-inside: |
              function $F(..., string $A, ..., string $B, ...) public {
                ...
              }
          - pattern-inside: |
              function $F(..., bytes $A, ..., string $B, ...) public {
                ...
              }
          - pattern-inside: |
              function $F(..., string $A, ..., bytes $B, ...) public {
                ...
              }
          - pattern-inside: |
              function $F(..., address[] $A, ..., address[] $B, ...) public {
                ...
              }
          - pattern-inside: |
              function $F(..., uint256[] $A, ..., uint256[] $B, ...) public {
                ...
              }
          - pattern-inside: |
              function $F(..., bytes $A, ..., bytes $B, ...) external {
                ...
              }
          - pattern-inside: |
              function $F(..., string $A, ..., string $B, ...) external {
                ...
              }
          - pattern-inside: |
              function $F(..., bytes $A, ..., string $B, ...) external {
                ...
              }
          - pattern-inside: |
              function $F(..., string $A, ..., bytes $B, ...) external {
                ...
              }
          - pattern-inside: |
              function $F(..., address[] $A, ..., address[] $B, ...) external {
                ...
              }
          - pattern-inside: |
              function $F(..., uint256[] $A, ..., uint256[] $B, ...) external {
                ...
              }
      - pattern-either:
          - pattern: |
              keccak256(abi.encodePacked(..., $A, $B, ...))
          - pattern: |
              $X = abi.encodePacked(..., $A, $B, ...);
              ...
              keccak256($X);
    languages:
      - solidity
    severity: ERROR
