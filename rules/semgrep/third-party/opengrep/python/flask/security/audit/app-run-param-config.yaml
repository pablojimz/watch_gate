rules:
- id: avoid_app_run_with_bad_host
  message: Running flask app with host 0.0.0.0 could expose the server publicly.
  metadata:
    cwe:
    - 'CWE-668: Exposure of Resource to Wrong Sphere'
    owasp:
    - A01:2021 - Broken Access Control
    category: security
    technology:
    - flask
    references:
    - https://owasp.org/Top10/A01_2021-Broken_Access_Control
    subcategory:
    - vuln
    likelihood: HIGH
    impact: MEDIUM
    confidence: HIGH
    severity_score: 50
    confidence_score: 30
    exploitability_score: 80
    risk_score: 52
    risk_justification: 'FALTA DATO: no se sabe si el entorno de despliegue expone la red; asumo exposición (E alto). host=0.0.0.0 es patrón común y legítimo en contenedores, baja confianza de que sea un fallo real.'
  languages: [python]
  severity: WARNING
  pattern-either:
  - pattern: app.run(..., host="0.0.0.0", ...)
  - pattern: app.run(..., "0.0.0.0", ...)
