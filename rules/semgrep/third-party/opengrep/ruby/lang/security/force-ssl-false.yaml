rules:
- id: force-ssl-false
  message: >-
    Checks for configuration setting of force_ssl to false. Force_ssl forces usage
    of HTTPS, which
    could lead to network interception of unencrypted application traffic. To fix,
    set config.force_ssl = true.
  metadata:
    cwe:
    - 'CWE-311: Missing Encryption of Sensitive Data'
    references:
    - https://github.com/presidentbeef/brakeman/blob/main/lib/brakeman/checks/check_force_ssl.rb
    category: security
    technology:
    - ruby
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A04:2021 - Insecure Design
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: HIGH
    severity_score: 50
    confidence_score: 80
    exploitability_score: 100
    risk_score: 72
    risk_justification: 'FALTA DATO: no se sabe si es config de entorno dev/test (uso legítimo común) o producción; asumo producción (conservador).'
  languages:
  - ruby
  severity: WARNING
  pattern: config.force_ssl = false
  fix-regex:
    regex: =\s*false
    replacement: = true
