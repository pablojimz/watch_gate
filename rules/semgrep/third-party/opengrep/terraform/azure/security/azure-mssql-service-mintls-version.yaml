rules:
- id: azure-mssql-service-mintls-version
  message: >-
    Ensure MSSQL is using the latest version of TLS encryption
  patterns:
  - pattern-either:
    - pattern: |
        "1.0"
    - pattern: |
        "1.1"
  - pattern-inside: minimum_tls_version = ...
  - pattern-inside: |
      $RESOURCE "azurerm_mssql_server" "..." {
      ...
      }
  metadata:
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    cwe:
    - 'CWE-326: Inadequate Encryption Strength'
    category: security
    technology:
    - terraform
    - azure
    references:
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: MEDIUM
    severity_score: 50
    confidence_score: 100
    exploitability_score: 100
    risk_score: 78
    risk_justification: minimum_tls_version literal 1.0/1.1 en MSSQL; enumeracion exacta.
    finding_type: vulnerability
  languages: [hcl]
  severity: WARNING
