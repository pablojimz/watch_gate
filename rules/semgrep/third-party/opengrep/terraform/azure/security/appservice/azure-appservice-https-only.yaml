rules:
- id: azure-appservice-https-only
  message: >-
    Ensure web app redirects all HTTP traffic to HTTPS in Azure App Service Slot
  patterns:
  - pattern: resource
  - pattern-not-inside: |
      resource "azurerm_app_service" "..." {
      ...
      https_only = true
      ...
      }
  - pattern-inside: |
      resource "azurerm_app_service" "..." {
      ...
      }
  metadata:
    owasp:
    - A03:2017 - Sensitive Data Exposure
    - A02:2021 - Cryptographic Failures
    cwe:
    - 'CWE-319: Cleartext Transmission of Sensitive Information'
    category: security
    technology:
    - terraform
    - azure
    references:
    - https://owasp.org/Top10/A02_2021-Cryptographic_Failures
    subcategory:
    - vuln
    likelihood: LOW
    impact: MEDIUM
    confidence: MEDIUM
    severity_score: 50
    confidence_score: 100
    exploitability_score: 100
    risk_score: 78
    risk_justification: https_only no forzado; duplicado mas simple del anterior, campo exacto.
    finding_type: vulnerability
  languages: [hcl]
  severity: WARNING
