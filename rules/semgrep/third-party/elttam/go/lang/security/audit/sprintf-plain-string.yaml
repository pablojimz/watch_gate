rules:
  - id: sprintf-unescaped-control-characters
    message: >-
      fmt.Sprintf()'s %s formatting verb does not escape control characters
      in a string, such as \u000a or backtick-enclosed multilines. This could
      lead to various vulnerabilities such as header injection, request
      smuggling, log injection, etc.
    metadata:
      category: security
      subcategory: audit
      likelihood: LOW
      impact: LOW
      confidence: MEDIUM
      technology:
        - golang
      severity_score: 75
      confidence_score: 80
      exploitability_score: 40
      risk_score: 68
      risk_justification: Taint real Sprintf(%s)->path/log sink; requiere que el dato con caracteres de control sea controlado por atacante.
      finding_type: vulnerability
    severity: WARNING
    languages:
      - go
    mode: taint
    options:
      symbolic_propagation: true
    pattern-sources:
      - patterns:
          # Need the `...` at the end outside of the function
          - pattern-inside: |
              func $FUNC(...) $TYPE {
                ...
                return fmt.Sprintf("$VERB", ...)
              }
              ...
          - metavariable-regex:
              metavariable: $VERB
              regex: .*%s
          - pattern: $FUNC(...)
    pattern-sinks:
      - pattern: filepath.Join(...)
      - pattern: path.Join(...)
      - pattern: $FUNC.log(...)
