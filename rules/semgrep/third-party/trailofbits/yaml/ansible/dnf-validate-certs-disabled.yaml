rules:
  - id: dnf-validate-certs-disabled
    message: Found dnf with SSL verification disabled
    languages: [yaml]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      subcategory: [audit]
      technology: [ansible, dnf]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://docs.ansible.com/ansible/latest/collections/ansible/builtin/dnf_module.html#parameter-validate_certs
        - https://docs.ansible.com/ansible/latest/collections/ansible/builtin/dnf5_module.html#parameter-validate_certs
      severity_score: "87.5"
      confidence_score: 100
      exploitability_score: 100
      risk_score: 94
      risk_justification: TLS no verificado en descarga dnf; mismo riesgo de sustitución de paquete vía MITM.
      finding_type: vulnerability
    patterns:
      - pattern-inside: |
          $DNF:
            ...
      - metavariable-pattern:
          metavariable: $DNF
          pattern-either:
            - pattern: dnf
            - pattern: ansible.builtin.dnf
            - pattern: dnf5
            - pattern: ansible.builtin.dnf5
      - pattern: "$KEY: $VALUE"
      - metavariable-pattern:
          metavariable: $KEY
          pattern-either:
            - pattern: validate_certs
      - metavariable-pattern:
          metavariable: $VALUE
          pattern-either:
            - pattern: "false"
