rules:
  - id: yum-validate-certs-disabled
    message: Found yum with SSL verification disabled
    languages: [yaml]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      subcategory: [audit]
      technology: [ansible, yum]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://docs.ansible.com/ansible/latest/collections/ansible/builtin/yum_module.html#parameter-validate_certs
      severity_score: "87.5"
      confidence_score: 100
      exploitability_score: 100
      risk_score: 94
      risk_justification: TLS no verificado en descarga yum; mismo riesgo de sustitución de paquete.
      finding_type: vulnerability
    patterns:
      - pattern-inside: |
          $YUM:
            ...
      - metavariable-pattern:
          metavariable: $YUM
          pattern-either:
            - pattern: yum
            - pattern: ansible.builtin.yum
      - pattern: "$KEY: $VALUE"
      - metavariable-pattern:
          metavariable: $KEY
          pattern-either:
            - pattern: validate_certs
      - metavariable-pattern:
          metavariable: $VALUE
          pattern-either:
            - pattern: "false"
