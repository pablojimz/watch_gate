rules:
  - id: wrm-cert-validation-ignore
    message: Found Windows Remote Management connection with certificate validation disabled
    languages: [yaml]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      subcategory: [audit]
      technology: [ansible]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://docs.ansible.com/ansible/latest/os_guide/windows_winrm.html#https-certificate-validation
      severity_score: 75
      confidence_score: 100
      exploitability_score: 100
      risk_score: 89
      risk_justification: Desactiva validación de certificado WinRM; MITM puede interceptar/alterar canal de administración remota de Windows.
    pattern: "ansible_winrm_server_cert_validation: ignore"
