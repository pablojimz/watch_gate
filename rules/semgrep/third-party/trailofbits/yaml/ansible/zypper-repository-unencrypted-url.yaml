rules:
  - id: zypper-repository-unencrypted-url
    message: Found Zypper repository with unencrypted URL (e.g. HTTP, FTP, etc.)
    languages: [yaml]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      subcategory: [audit]
      technology: [ansible, zypper]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://docs.ansible.com/ansible/latest/collections/community/general/zypper_module.html#parameter-name
      severity_score: "87.5"
      confidence_score: 100
      exploitability_score: 100
      risk_score: 94
      risk_justification: Repositorio zypper sin cifrar; compromete la confianza de todos los paquetes futuros de ese repo.
    patterns:
      - pattern-inside: |
          $ZYPPER:
            ...
      - pattern: "$KEY: '$VALUE'"
      - metavariable-pattern:
          metavariable: $KEY
          pattern-either:
            - pattern: repo
      - metavariable-pattern:
          metavariable: $ZYPPER
          pattern-either:
            - pattern: zypper_repository
            - pattern: community.general.zypper_repository
      - metavariable-regex:
          metavariable: $VALUE
          regex: "(?i)^(http|ftp)://.*"
