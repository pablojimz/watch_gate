rules:
  - id: apt-key-validate-certs-disabled
    message: Found apt key with SSL verification disabled
    languages: [yaml]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      subcategory: [audit]
      technology: [ansible, apt]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://docs.ansible.com/ansible/latest/collections/ansible/builtin/apt_key_module.html#parameter-validate_certs
      severity_score: "87.5"
      confidence_score: 100
      exploitability_score: 100
      risk_score: 94
      risk_justification: TLS no verificado al descargar clave de firma; mismo riesgo de suplantación de clave de confianza vía MITM.
      finding_type: vulnerability
    patterns:
      - pattern-inside: |
          $APTKEY:
            ...
            url: ...
            ...
      - metavariable-pattern:
          metavariable: $APTKEY
          pattern-either:
            - pattern: apt_key
            - pattern: ansible.builtin.apt_key
      - pattern: "$KEY: $VALUE"
      - metavariable-pattern:
          metavariable: $KEY
          pattern-either:
            - pattern: validate_certs
      - metavariable-pattern:
          metavariable: $VALUE
          pattern-either:
            - pattern: "false"
