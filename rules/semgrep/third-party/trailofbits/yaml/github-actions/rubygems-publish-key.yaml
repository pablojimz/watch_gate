rules:
  - id: rubygems-publish-key
    message: |
      Found long-term access key. Instead prefer RubyGems trusted publishing and
      temporary OIDC security credentials.
    languages: [yaml]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      subcategory: [audit]
      confidence: HIGH
      likelihood: LOW
      impact: MEDIUM
      technology: [rubygems, github-actions]
      references:
        - https://guides.rubygems.org/trusted-publishing/
        - https://guides.rubygems.org/api-key-scopes/#usage-with-gem-cli
        - https://github.com/rubygems/release-gem
      severity_score: 75
      confidence_score: 30
      exploitability_score: 100
      risk_score: 68
      risk_justification: 'FALTA DATO: patrón es solo el identificador GEM_HOST_API_KEY sin contexto de valor, muy amplio; conservador=secreto expuesto.'
      finding_type: vulnerability
    pattern: GEM_HOST_API_KEY
