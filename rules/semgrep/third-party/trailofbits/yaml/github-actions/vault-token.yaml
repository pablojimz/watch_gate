rules:
  - id: vault-token
    message: |
      Found long-term access key. Instead prefer Vault role assumption and
      temporary OIDC security credentials.
    languages: [yaml]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      subcategory: [audit]
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
      technology: [vault, github-actions]
      references:
        - https://developer.hashicorp.com/vault/docs/platform/github-actions
        - https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-hashicorp-vault
        - https://github.com/hashicorp/vault-action
      severity_score: 75
      confidence_score: 30
      exploitability_score: 100
      risk_score: 68
      risk_justification: "FALTA DATO: idem, 'token'/VAULT_TOKEN puede ser secrets.* legítimo; conservador=secreto expuesto."
      finding_type: vulnerability
    patterns:
      - pattern-inside: |
          uses: "$ACTION"
          ...
      - metavariable-regex:
          metavariable: $ACTION
          regex: ^hashicorp/vault-action
      - pattern-either:
          - pattern: |
              with:
                ...
                token: ...
          - pattern: |
              env:
                ...
                VAULT_TOKEN: ...
