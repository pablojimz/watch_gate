rules:
  - id: pypi-publish-password
    message: |
      Found long-term access key. Instead prefer PyPI trusted publishing and
      temporary OIDC security credentials.
    languages: [yaml]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      subcategory: [audit]
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
      technology: [pypi, github-actions]
      references:
        - https://docs.pypi.org/trusted-publishers/
        - https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-pypi
        - https://github.com/pypa/gh-action-pypi-publish
      severity_score: 75
      confidence_score: 30
      exploitability_score: 100
      risk_score: 68
      risk_justification: "FALTA DATO: idem, 'password:' es el mecanismo estándar pre-trusted-publishing vía secrets.*; conservador=secreto expuesto."
      finding_type: vulnerability
    patterns:
      - pattern-inside: |
          uses: "$ACTION"
          ...
      - metavariable-regex:
          metavariable: $ACTION
          regex: ^pypa/gh-action-pypi-publish
      - pattern: |
          with:
            ...
            password: ...
