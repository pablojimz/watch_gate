rules:
  - id: aws-secret-key
    message: |
      Found long-term access key. Instead prefer AWS role assumption and
      temporary OIDC security credentials.
    languages: [yaml]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      subcategory: [audit]
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
      technology: [aws, github-actions]
      references:
        - https://docs.aws.amazon.com/IAM/latest/UserGuide/security-creds.html#sec-alternatives-to-long-term-access-keys
        - https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-amazon-web-services
        - https://github.com/aws-actions/configure-aws-credentials
      severity_score: 75
      confidence_score: 30
      exploitability_score: 100
      risk_score: 68
      risk_justification: 'FALTA DATO: patrón no distingue valor literal hardcodeado de referencia legítima ${{ secrets.* }}; conservador=secreto expuesto. Coincide con el uso mayoritario legítimo de la action.'
      finding_type: vulnerability
    patterns:
      - pattern-inside: |
          uses: "$ACTION"
          ...
      - metavariable-regex:
          metavariable: $ACTION
          regex: ^aws-actions/configure-aws-credentials
      - pattern-either:
          - pattern: |
              with:
                ...
                aws-secret-access-key: ...
          - pattern: |
              env:
                ...
                AWS_SECRET_ACCESS_KEY: ...
