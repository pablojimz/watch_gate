rules:
  - id: azure-principal-secret
    message: |
      Found long-term access key. Instead prefer Azure subscription ID and
      temporary OIDC security credentials.
    languages: [yaml]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      subcategory: [audit]
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
      technology: [azure, github-actions]
      references:
        - https://learn.microsoft.com/en-us/azure/developer/github/connect-from-azure
        - https://docs.github.com/en/actions/deployment/security-hardening-your-deployments/configuring-openid-connect-in-azure
        - https://github.com/Azure/login
      severity_score: 75
      confidence_score: 30
      exploitability_score: 100
      risk_score: 68
      risk_justification: "FALTA DATO: idem, 'creds:' puede ser secrets.* legítimo o literal; conservador=secreto expuesto."
    patterns:
      - pattern-inside: |
          uses: "$ACTION"
          ...
      - metavariable-regex:
          metavariable: $ACTION
          regex: ^azure/login
      - pattern: |
          with:
            ...
            creds: ...
