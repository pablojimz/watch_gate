rules:
  - id: podman-tls-verify-disabled
    message: |
      Found Nomad task using Podman with registry TLS verification disabled
    languages: [hcl]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      subcategory: [audit]
      confidence: HIGH
      likelihood: MEDIUM
      impact: LOW
      technology: [nomad, podman]
      references:
        - https://developer.hashicorp.com/nomad/plugins/drivers/podman#auth
      severity_score: 50
      confidence_score: 100
      exploitability_score: 100
      risk_score: 78
      risk_justification: Verificación TLS de registry deshabilitada; literal exacto, config de infra siempre activa.
      finding_type: vulnerability
    patterns:
      - pattern-inside: |
          task "..." {
            ...
            driver = "podman"
            ...
            config {
              ...
              auth {
                ...
              }
              ...
            }
            ...
          }
      - pattern: tlsVerify = false
