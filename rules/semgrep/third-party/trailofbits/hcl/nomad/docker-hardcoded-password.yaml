rules:
  - id: docker-hardcoded-password
    message: |
      Found Nomad task using Docker auth with hardcoded password
    languages: [hcl]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      subcategory: [audit]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [nomad, docker, podman]
      references:
        - https://developer.hashicorp.com/nomad/docs/drivers/docker#password
      severity_score: 75
      confidence_score: 100
      exploitability_score: 100
      risk_score: 89
      risk_justification: Password hardcodeada en spec de job Nomad; credencial expuesta en repo/despliegue.
    patterns:
      - pattern-inside: |
          task "..." {
            ...
            driver = "$RUNTIME"
            ...
            config {
              ...
              auth {
                ...
              }
              ...
            }
            ...
          }
      - pattern: password = "..."
      - metavariable-regex:
          metavariable: $RUNTIME
          regex: (docker|podman)
