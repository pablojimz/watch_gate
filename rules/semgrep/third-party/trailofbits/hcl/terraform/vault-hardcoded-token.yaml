rules:
  - id: vault-hardcoded-token
    message: |
      Found Terraform Vault instance with hardcoded token
    languages: [hcl]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-798: Use of Hard-coded Credentials"
      subcategory: [audit]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [terraform]
      references:
        - https://registry.terraform.io/providers/hashicorp/vault/latest/docs#token
      severity_score: 75
      confidence_score: 100
      exploitability_score: 100
      risk_score: 89
      risk_justification: Token de Vault hardcodeado en provider Terraform; secreto expuesto en repo/estado.
      finding_type: vulnerability
    patterns:
      - pattern-inside: provider "vault" { ... }
      - pattern: token = "..."
