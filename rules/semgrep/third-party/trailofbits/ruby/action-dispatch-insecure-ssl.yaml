rules:
  - id: action-dispatch-insecure-ssl
    message: |
      Found Rails application with insecure SSL setting.
    languages: [ruby]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      subcategory: [audit]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [rails]
      references:
        - https://api.rubyonrails.org/v7.1.3.4/classes/ActionDispatch/SSL.html
      severity_score: 50
      confidence_score: 100
      exploitability_score: 80
      risk_score: 72
      risk_justification: 'FALTA DATO: no se puede confirmar si el bloque configure es de producción o desarrollo; se asume producción (conservador).'
      finding_type: vulnerability
    patterns:
      - pattern-inside: |
          Rails.application.configure do
            ...
          end
      - pattern-either:
          - pattern: "config.force_ssl = false"
          - pattern: "config.ssl_options = { ..., secure_cookies: false, ... }"
          - pattern: "config.ssl_options = { ..., hsts: false, ... }"
          - pattern: "config.ssl_options = { ..., hsts: { ..., subdomains: false, ... }, ... }"
