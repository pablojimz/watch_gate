rules:
  - id: faraday-disable-verification
    message: |
      Found Faraday HTTP request disabling SSL/TLS verification.
    languages: [ruby]
    severity: WARNING
    metadata:
      category: security
      cwe: "CWE-295: Improper Certificate Validation"
      subcategory: [audit]
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      technology: [faraday]
      references:
        - https://lostisland.github.io/faraday/#/customization/ssl-options
      severity_score: 50
      confidence_score: 100
      exploitability_score: 80
      risk_score: 72
      risk_justification: Verificación SSL deshabilitada en cliente Faraday; literales exactos, sin ambigüedad.
    pattern-either:
      - pattern: "Faraday.new(..., ssl: { ..., verify: false, ... }, ...)"
      - pattern: "Faraday.new(..., ssl: { ..., verify_hostname: false, ... }, ...)"
      - pattern: "Faraday.new(..., ssl: { ..., verify_mode: OpenSSL::SSL::VERIFY_NONE, ... }, ...)"
