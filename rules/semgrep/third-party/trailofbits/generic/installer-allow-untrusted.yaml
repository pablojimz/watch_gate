rules:
  - id: installer-allow-untrusted
    message: Found `installer` command allowing untrusted installations
    languages: [generic]
    severity: WARNING
    metadata:
      category: security
      subcategory: [audit]
      technology: [shell]
      cwe: "CWE-494: Download of Code Without Integrity Check"
      confidence: HIGH
      likelihood: HIGH
      impact: HIGH
      references:
        - https://ss64.com/mac/installer.html
      severity_score: "87.5"
      confidence_score: 100
      exploitability_score: 80
      risk_score: 89
      risk_justification: 'FALTA DATO: idem ejecución, conservador=80. Instala paquete sin verificar firma y ejecuta scripts con privilegios; requiere fuente manipulada (MITM/supply chain).'
    pattern: installer ... -allowUntrusted
