rules:
  - id: curl-unencrypted-url
    message: Found `curl` command with unencrypted URL (e.g. HTTP, FTP, etc.)
    languages: [generic]
    severity: WARNING
    metadata:
      category: security
      subcategory: [audit]
      technology: [shell]
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://curl.se/docs/manpage.html
      severity_score: 50
      confidence_score: 80
      exploitability_score: 80
      risk_score: 66
      risk_justification: 'FALTA DATO: idem ejecución, conservador=80. Excluye IPs locales/metadata pero no evalúa sensibilidad del dato transmitido.'
    patterns:
      - pattern-either:
          - pattern: curl ... http://
          - pattern: curl ... ftp://
      - pattern-not-inside: curl ... http://127.0.0.1
      - pattern-not-inside: curl ... http://localhost
      - pattern-not-inside: curl ... http://169.254.169.254
      - pattern-not-inside: curl ... http://[fd00:ec2::254]
      - pattern-not-inside: curl ... http://metadata.google.internal
