rules:
  - id: ssh-disable-host-key-checking
    message: Found `ssh` command disabling host key checking
    languages: [generic]
    severity: WARNING
    metadata:
      category: security
      subcategory: [audit]
      technology: [shell]
      cwe: "CWE-295: Improper Certificate Validation"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://man7.org/linux/man-pages/man1/ssh.1.html
      severity_score: 50
      confidence_score: 100
      exploitability_score: 80
      risk_score: 72
      risk_justification: 'FALTA DATO: idem ejecución, conservador=80. Desactiva verificación de host SSH, habilita MITM.'
      finding_type: vulnerability
    pattern: ssh ... StrictHostKeyChecking=no
