rules:
  - id: wget-unencrypted-url
    message: Found `wget` command  with unencrypted URL (e.g. HTTP, FTP, etc.)
    languages: [generic]
    severity: WARNING
    metadata:
      category: security
      subcategory: [audit]
      technology: [shell]
      cwe: "CWE-319: Cleartext Transmission of Sensitive Information"
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
      references:
        - https://linux.die.net/man/1/wget
      severity_score: 50
      confidence_score: 80
      exploitability_score: 80
      risk_score: 66
      risk_justification: 'FALTA DATO: idem ejecución, conservador=80. Excluye IPs locales/metadata pero no evalúa sensibilidad del contenido.'
    patterns:
      - pattern-either:
          - pattern: wget ... http://
          - pattern: wget ... ftp://
      - pattern-not-inside: wget ... http://127.0.0.1
      - pattern-not-inside: wget ... http://localhost
      - pattern-not-inside: wget ... http://169.254.169.254
      - pattern-not-inside: wget ... http://[fd00:ec2::254]
      - pattern-not-inside: wget ... http://metadata.google.internal
