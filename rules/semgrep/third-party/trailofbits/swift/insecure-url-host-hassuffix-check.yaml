rules:
  - id: insecure-url-host-hassuffix-check
    message: >
      Potentially insecure URL host suffix check. Using hasSuffix("domain.com") without  a leading dot can match unintended domains like "fakedomain.com"
    languages: [swift]
    severity: WARNING
    metadata:
      category: security
      cwe: CWE-697
      technology: [swift, ios]
      subcategory: [audit]
      confidence: HIGH
      likelihood: HIGH
      impact: MEDIUM
      references:
        - https://developer.apple.com/documentation/foundation/url/host(percentencoded:)
        - https://developer.apple.com/documentation/foundation/nsstring/hassuffix(_:)
      severity_score: 50
      confidence_score: 80
      exploitability_score: 40
      risk_score: 56
      risk_justification: 'FALTA DATO: no se sabe si el check de host protege una decisión de seguridad; se asume que sí. hasSuffix sin punto permite bypass de allowlist de dominio.'
    pattern-either:
      # Pattern 1: Any .host property followed by hasSuffix
      - patterns:
          - pattern: $X.hasSuffix($SUFFIX)
          - metavariable-regex:
              metavariable: $SUFFIX
              regex: '^"(?!\.)[a-zA-Z0-9\-]+(\.[a-zA-Z0-9\-]+)+"$'
          - metavariable-regex:
              metavariable: $X
              regex: '.*\.host'

      # Pattern 2: Inside URL extension
      - patterns:
          - pattern-either:
              - pattern: host?.hasSuffix($SUFFIX)
              - pattern: host.hasSuffix($SUFFIX)
              - pattern: self.host?.hasSuffix($SUFFIX)
              - pattern: self.host.hasSuffix($SUFFIX)
              - pattern: host?.hasSuffix($SUFFIX) ?? $D
          - metavariable-regex:
              metavariable: $SUFFIX
              regex: '^"(?!\.)[a-zA-Z0-9\-]+(\.[a-zA-Z0-9\-]+)+"$'
          - pattern-inside: |
              extension URL { ... }

      # Pattern 3: Variables bound from URL.host
      - patterns:
          - pattern: $VAR.hasSuffix($SUFFIX)
          - metavariable-regex:
              metavariable: $SUFFIX
              regex: '^"(?!\.)[a-zA-Z0-9\-]+(\.[a-zA-Z0-9\-]+)+"$'
          - pattern-either:
              - pattern-inside: |
                  if let $VAR = $_.host { ... }
              - pattern-inside: |
                  guard let $VAR = $_.host else { ... }
                  ...
              - pattern-inside: |
                  guard ..., let $VAR = $_.host, ... else { ... }
                  ...
              - pattern-inside: |
                  let $VAR = $_.host
                  ...
              - pattern-inside: |
                  var $VAR = $_.host
                  ...
