rules:
  - id: racy-write-to-map
    message: >-
      Writing `$MAP` from multiple goroutines is not concurrency safe
    languages: [go]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-362: Concurrent Execution using Shared Resource with Improper Synchronization ('Race Condition')"
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: HIGH
      impact: MEDIUM
      technology: [--no-technology--]
      description: "Concurrent writes to the same map in multiple goroutines"
      references:
        - https://go.dev/blog/maps#concurrency

      severity_score: 25
      confidence_score: 60
      exploitability_score: 80
      risk_score: 49
      risk_justification: Escritura concurrente en map provoca panic fatal (DoS) si se activa; bug de concurrencia.
      finding_type: vulnerability
    patterns:
      - pattern: |
          $MAP[$KEY] = $VALUE
      - pattern-inside: |
          $MAP = make(map[$KTYPE]$VTYPE)
          ...
          for ... {
            ...
            go func(...) {
              ...
              $MAP[$KEY] = $VALUE
              ...
            }(...)
            ...
          }
      - pattern-not-inside: |
          $MUTEX.Lock()
          ...
          $MUTEX.Unlock()
      - pattern-not-inside: |
          $MUTEX.Lock()
          ...
          defer $MUTEX.Unlock()
          ...
