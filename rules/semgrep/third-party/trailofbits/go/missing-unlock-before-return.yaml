rules:
  - id: missing-unlock-before-return
    message: >-
      Missing mutex unlock (`$T` variable) before returning from a function.  This could result in panics resulting from double lock operations
    languages: [go]
    severity: ERROR
    metadata:
      category: security
      cwe: "CWE-667: Improper Locking"
      subcategory: [vuln]
      confidence: MEDIUM
      likelihood: HIGH
      impact: MEDIUM
      technology: [--no-technology--]
      description: "Missing `mutex` unlock before returning from a function"
      references:
        - https://pkg.go.dev/sync#Mutex
        - https://blog.trailofbits.com/2020/06/09/how-to-check-if-a-mutex-is-locked-in-go/

      severity_score: 25
      confidence_score: 60
      exploitability_score: 80
      risk_score: 49
      risk_justification: Doble lock/deadlock potencial; bug de fiabilidad, sin RCE.
    patterns:
      - pattern-either:
          - pattern: panic(...)
          - pattern: return ...
      - metavariable-pattern:
          metavariable: $T
          patterns:
            - pattern: |
                ($T : sync.Mutex)
      - pattern-inside: |
          $T.Lock()
          ...
      - pattern-not-inside: |
          $T.Unlock()
          ...
      - pattern-not-inside: |
          defer $T.Unlock()
          ...
      - pattern-not-inside: |
          defer func(...) {
            ...
            $T.Unlock()
            ...
          }(...)
          ...
      - pattern-not-inside: |
          $FOO(..., ..., func(...) { 
              ... 
          })
      - pattern-not-inside: |
          return func(...) {
              ...
              $T.Unlock()
              ...
          }
