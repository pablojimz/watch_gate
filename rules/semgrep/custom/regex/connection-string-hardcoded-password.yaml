rules:
  - id: connection-string-hardcoded-password
    languages: [regex]
    severity: WARNING
    message: >-
      Found a connection URI (mongodb://, postgres(ql)://, mysql://,
      redis(s)://, amqp(s)://) with a hardcoded, non-empty password embedded
      directly in the string (scheme://user:password@host). If this string
      ends up in source control, logs, or error messages, the credential is
      immediately compromised. Load the password from a secrets manager or
      environment variable at runtime instead of hardcoding it in the
      connection string.
    metadata:
      category: security
      confidence: LOW
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
      severity_score: 75
      confidence_score: 60
      exploitability_score: 100
      risk_score: 77
      risk_justification: "Password embebida en URI de conexion queda comprometida en cuanto se commitea (secreto se escapa); regex razonablemente especifica sobre esquemas conocidos, excluye placeholders con $/{} (mas precisa que LOW generico); exposicion inmediata y permanente."
    patterns:
      - pattern-regex: (?i)(mongodb|postgres|postgresql|mysql|rediss?|amqps?)://[^:/\s]+:[^@/\s${}%]{3,}@
