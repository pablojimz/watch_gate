rules:
  - id: express-cors-wildcard-credentials
    languages: [js, ts]
    severity: ERROR
    message: >-
      Found the Express `cors` middleware configured with origin: true (or a
      function that reflects any Origin header back) combined with
      credentials: true. This tells browsers it is safe to send
      cookies/Authorization headers on cross-origin requests from ANY site
      that asks, effectively disabling the same-origin policy for
      authenticated requests - any malicious website can make authenticated
      requests to your API on behalf of a logged-in victim and read the
      response. Set origin to an explicit allow-list of trusted domains when
      credentials: true is required.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      owasp: ["A05:2021 - Security Misconfiguration"]
      references:
        - https://cwe.mitre.org/data/definitions/942.html
        - https://github.com/expressjs/cors#configuration-options
        - https://owasp.org/www-community/attacks/CORS_OriginHeaderScrutiny
      severity_score: 75
      confidence_score: 100
      exploitability_score: 80
      risk_score: 84
      risk_justification: "origin:true + credentials:true permite robo de respuestas autenticadas cross-origin (requiere que la victima visite el sitio atacante); patron literal exacto sobre config (HIGH); activo en cada request mientras la app corre."
      finding_type: vulnerability
    patterns:
      - pattern-either:
          - pattern: 'cors({..., origin: true, ..., credentials: true, ...})'
          - pattern: 'cors({..., credentials: true, ..., origin: true, ...})'
