rules:
  - id: dockerfile-hardcoded-secret-env
    languages: [dockerfile]
    severity: ERROR
    message: >-
      Found a hardcoded secret in an ENV or ARG instruction (variable name
      suggests a password/token/key). ENV values are baked into every image
      layer and visible to anyone with `docker history`/`docker inspect`
      access, or anyone who pulls the image; ARG values are visible in the
      build history unless explicitly using BuildKit secret mounts. Pass
      secrets at runtime via a secrets manager, an orchestrator's secret
      mechanism, or `docker run --env-file` with a file that is never
      committed - never bake them into the image.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://docs.docker.com/build/building/secrets/
      severity_score: 75
      confidence_score: 60
      exploitability_score: 100
      risk_score: 77
      risk_justification: "Secreto horneado en capa de imagen, visible via docker history/inspect; regex por palabra clave, moderadamente precisa; expuesto automaticamente en cada build."
      finding_type: vulnerability
    pattern-regex: (?i)^(ENV|ARG)\s+\w*(PASSWORD|PASSWD|SECRET|APIKEY|API_KEY|TOKEN|PRIVATE_KEY)\w*\s*=\s*(?!\$)\S+
