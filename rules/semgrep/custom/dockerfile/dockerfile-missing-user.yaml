rules:
  - id: dockerfile-missing-user
    languages: [dockerfile]
    severity: WARNING
    message: >-
      This Dockerfile never switches away from the default root user with a
      USER instruction. Containers that run as root give an attacker who
      breaks out of the application (e.g. via a code execution
      vulnerability) root privileges inside the container, which
      significantly widens the blast radius of a container-escape
      vulnerability. Add a non-root USER instruction after installing
      dependencies and before running the application.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-250: Execution with Unnecessary Privileges"
      owasp: ["A05:2021 - Security Misconfiguration"]
      references:
        - https://cwe.mitre.org/data/definitions/250.html
        - https://docs.docker.com/engine/reference/builder/#user
      severity_score: 50
      confidence_score: 60
      exploitability_score: 100
      risk_score: 66
      risk_justification: "Contenedor corre como root, amplia el radio de una vulnerabilidad de escape (candado roto, no explotable por si sola); heuristica estructural sobre ausencia de USER; se aplica en cada build sin intervencion."
      finding_type: vulnerability
    patterns:
      - pattern: |
          FROM $IMAGE
          ...
      - pattern-not: |
          FROM $IMAGE
          ...
          USER ...
          ...
