rules:
  - id: powershell-download-and-execute
    languages: [generic]
    severity: ERROR
    message: >-
      Found the classic "download and execute" pattern: content fetched from
      a remote URL (DownloadString/Invoke-WebRequest) is piped or passed
      directly into Invoke-Expression/iex. This executes whatever the remote
      server returns with no integrity check and no way to audit what ran; if
      the URL or the remote server response is ever tampered with (compromised
      host, DNS hijack, on-path attacker over HTTP), this is arbitrary code
      execution. This exact idiom is also a well-known indicator used by
      malware droppers. Download to a file, verify its checksum/signature, and
      only then execute it explicitly.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-494: Download of Code Without Integrity Check"
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/494.html
        - https://attack.mitre.org/techniques/T1059/001/
    options:
      generic_ellipsis_max_span: 0
    patterns:
      - pattern-either:
          - pattern: Invoke-Expression (New-Object Net.WebClient).DownloadString(...)
          - pattern: iex (New-Object Net.WebClient).DownloadString(...)
          - pattern: Invoke-Expression (Invoke-WebRequest ...).Content
          - pattern: iex (Invoke-WebRequest ...)
