rules:
  - id: npm-packagejson-git-dependency
    languages: [json]
    severity: WARNING
    message: >-
      Found a package.json dependency pinned to a git/GitHub URL or a
      "latest"/unpinned range instead of an exact, registry-published
      version. Git-URL dependencies bypass npm registry integrity checks
      (no lockfile hash verification against a tarball) and can change
      silently if the branch/tag is force-pushed or the repo is deleted and
      recreated by an attacker (repojacking) - both are real supply-chain
      attack vectors. Depend on exact published versions from the npm
      registry with integrity hashes locked in package-lock.json.
    metadata:
      category: security
      confidence: LOW
      cwe: "CWE-494: Download of Code Without Integrity Check"
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/494.html
        - https://docs.npmjs.com/cli/v10/configuring-npm/package-json#git-urls-as-dependencies
    patterns:
      - pattern: '"$PKG": $VALUE'
      - metavariable-regex:
          metavariable: $VALUE
          regex: (?i)^"(git\+|github:).*"$
