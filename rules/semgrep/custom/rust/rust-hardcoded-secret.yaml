rules:
  - id: rust-hardcoded-secret
    languages: [rust]
    severity: WARNING
    message: >-
      Found a `const`/`static`/`let` binding whose name suggests a
      security-sensitive value (password, secret, api key, token...)
      initialized with a fixed string literal. Hardcoded credentials
      compiled into a binary are trivially recoverable by anyone with the
      binary (via `strings` or a disassembler), and if the source is in
      version control the credential is permanently exposed in history even
      after removal. Load secrets from environment variables or a secrets
      manager at runtime instead.
    metadata:
      category: security
      confidence: LOW
      cwe: "CWE-798: Use of Hard-coded Credentials"
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://owasp.org/www-community/vulnerabilities/Use_of_hard-coded_password
    patterns:
      - pattern-either:
          - pattern: 'const $NAME: &str = "...";'
          - pattern: 'static $NAME: &str = "...";'
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i).*(PASSWORD|PASSWD|SECRET|API_KEY|APIKEY|TOKEN|PRIVATE_KEY).*
