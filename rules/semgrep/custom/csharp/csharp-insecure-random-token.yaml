rules:
  - id: csharp-insecure-random-token
    languages: [csharp]
    severity: WARNING
    message: >-
      Found System.Random used to generate a value assigned to a variable
      whose name suggests a security-sensitive purpose (token, password,
      secret, key, otp, salt...). System.Random is a pseudo-random generator
      seeded predictably and is not cryptographically secure; its output can
      be predicted or brute-forced by an attacker. Use
      System.Security.Cryptography.RandomNumberGenerator (or
      RandomNumberGenerator.GetBytes/GetInt32) for anything
      security-sensitive.
    metadata:
      category: security
      confidence: MEDIUM
      cwe: "CWE-330: Use of Insufficiently Random Values"
      owasp: ["A02:2021 - Cryptographic Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/330.html
        - https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.randomnumbergenerator
    patterns:
      - pattern-either:
          - pattern: $TYPE $TOKEN = new Random(...).Next(...);
          - pattern: $TYPE $TOKEN = new Random(...).NextDouble();
          - pattern: |
              var $RAND = new Random(...);
              ...
              $TYPE2 $TOKEN = $RAND.Next(...);
          - pattern: |
              var $RAND = new Random(...);
              ...
              $TYPE2 $TOKEN = $RAND.NextDouble();
      - metavariable-regex:
          metavariable: $TOKEN
          regex: (?i).*(token|password|passwd|secret|apikey|api_key|otp|salt).*
