rules:
  - id: java-weak-hash-algorithm
    languages: [java]
    severity: WARNING
    message: >-
      Found MessageDigest.getInstance() using a cryptographically broken hash
      algorithm (MD5 or SHA-1). Both have known practical collision attacks
      and must not be used for security purposes such as password hashing,
      digital signatures, or integrity checks on attacker-influenced data.
      Use SHA-256 or stronger for integrity checks, and a dedicated password
      hashing function (bcrypt/scrypt/Argon2/PBKDF2) for passwords - never a
      general-purpose hash function.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp: ["A02:2021 - Cryptographic Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/327.html
        - https://owasp.org/www-community/vulnerabilities/Insecure_Cryptographic_Storage
      severity_score: 50
      confidence_score: 100
      exploitability_score: 80
      risk_score: 72
      risk_justification: "MD5/SHA-1 son criptograficamente rotos (candado debil); nombres de algoritmo exactos, sin ambiguedad (HIGH); se usa en ejecucion normal."
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance("MD5")
          - pattern: MessageDigest.getInstance("SHA-1")
          - pattern: MessageDigest.getInstance("SHA1")
