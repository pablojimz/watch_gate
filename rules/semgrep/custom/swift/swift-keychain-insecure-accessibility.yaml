rules:
  - id: swift-keychain-insecure-accessibility
    languages: [swift]
    severity: WARNING
    message: >-
      Found a Keychain item stored with kSecAttrAccessibleAlways (or the
      deprecated kSecAttrAccessibleAlwaysThisDeviceOnly). These
      accessibility levels let the item be read even while the device is
      locked and, for the non-"ThisDeviceOnly" variant, allow the item to be
      included in unencrypted device backups. For sensitive data (tokens,
      passwords, keys), use kSecAttrAccessibleWhenUnlockedThisDeviceOnly (or
      an equivalent *ThisDeviceOnly level that also requires the device to
      be unlocked) instead.
    metadata:
      category: security
      confidence: HIGH
      cwe: "CWE-522: Insufficiently Protected Credentials"
      owasp: ["A02:2021 - Cryptographic Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/522.html
        - https://developer.apple.com/documentation/security/ksecattraccessiblealways
      severity_score: 50
      confidence_score: 100
      exploitability_score: 80
      risk_score: 72
      risk_justification: "Nivel de accesibilidad debil del Keychain permite lectura con dispositivo bloqueado o en backups sin cifrar (candado roto); constantes exactas, sin ambiguedad (HIGH); ejecucion normal."
      finding_type: vulnerability
    patterns:
      - pattern-either:
          - pattern: kSecAttrAccessibleAlways
          - pattern: kSecAttrAccessibleAlwaysThisDeviceOnly
