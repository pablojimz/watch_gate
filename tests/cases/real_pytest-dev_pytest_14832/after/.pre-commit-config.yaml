minimum_pre_commit_version: "4.4.0"
repos:
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: "v0.16.1"
  hooks:
    - id: ruff-check
      args: ["--fix"]
    -   id: end-of-file-fixer
    -   id: check-yaml
- repo: https://github.com/woodruffw/zizmor-pre-commit
  rev: v1.29.0
  hooks:
    - id: zizmor
      args: ["--fix", "--no-progress"]
