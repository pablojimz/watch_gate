# Orquestación local de los 4 servicios desplegables (Engine API, backend
# y frontend del Dashboard, Postgres) -- pensado para probar un despliegue
# "de verdad" en local, incluido Postgres real (el soporte estaba validado
# a mano contra una instancia real, pero nunca se había provisionado ni en
# CI ni en un entorno reproducible -- esto no sustituye tenerlo en CI, pero
# sí da un `docker compose up` con el que cualquiera puede reproducirlo).
#
# Uso:
#   cp .env.example .env   # y rellena WATCHGATE_LLM_API_KEY como mínimo
#   docker compose up --build
#
# Dashboard: http://localhost:5173 (nginx sirviendo el build + proxy /api)
# Engine API: http://localhost:8080/health
#
# Para producción con TLS automático delante de todo (Caddy, Let's Encrypt
# o certificado autofirmado si no hay dominio público), ver el overlay
# docker-compose.prod.yml: `docker compose -f docker-compose.yml -f
# docker-compose.prod.yml up --build -d`.

services:
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: watchgate
      POSTGRES_PASSWORD: watchgate
      POSTGRES_DB: watchgate
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Crea además la base "watchgate_dashboard" al arrancar con un volumen
      # vacío -- ver docker/postgres-init/01-create-dashboard-db.sql para el
      # porqué (el esquema del Dashboard y el esquema SQLModel compartido
      # definen ambos una tabla `pr_scores` incompatible entre sí; no pueden
      # convivir en la misma base de datos).
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U watchgate"]
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - "5432:5432"

  engine-api:
    build:
      context: .
      dockerfile: docker/engine-api.Dockerfile
    env_file:
      - .env
    environment:
      WATCHGATE_DATABASE_URL: postgresql+psycopg://watchgate:watchgate@postgres:5432/watchgate
      # Sin esto, POST /api/v1/analyze (Puerta 3) solo hereda esta variable
      # de tu .env local -- que en .env.example viene vacía -- y cae a
      # SQLite local dentro de ESTE contenedor (.watchgate/dashboard.db),
      # una base de datos aislada que dashboard-backend nunca lee. El
      # resultado del análisis se guarda "bien" (sin excepción, así que ni
      # siquiera se ve el logger.warning del espejo best-effort) pero
      # /repos del frontend nunca lo ve. Mismo valor que usa
      # dashboard-backend más abajo, a propósito: ambos servicios deben
      # apuntar siempre a la misma base de datos del dashboard.
      WATCHGATE_DASHBOARD_DATABASE_URL: postgresql://watchgate:watchgate@postgres:5432/watchgate_dashboard
      # Necesaria para encolar `index_uploaded_repo_snapshot` (mapa de
      # conocimiento de un repo de servidor Git propio, ver
      # api/routers/hooks.py::upload_repo_snapshot) en el mismo
      # `dashboard-worker` que procesa el resto de tareas -- sin esto, ese
      # trabajo (llamadas de LLM por cada fichero del repo) se ejecutaría
      # DENTRO del propio proceso de Engine API vía BackgroundTasks,
      # bloqueando su capacidad de servir /analyze y su propio healthcheck
      # mientras dura el indexado (reproducido en vivo: el contenedor pasó
      # a "unhealthy" indexando un repo de 232 ficheros).
      WATCHGATE_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8080:8080"

  dashboard-backend:
    build:
      context: .
      dockerfile: docker/dashboard-backend.Dockerfile
    env_file:
      - .env
    environment:
      # Base separada de la del esquema SQLModel compartido (ver
      # docker/postgres-init/01-create-dashboard-db.sql) -- ambos esquemas
      # definen una tabla `pr_scores` incompatible entre sí.
      WATCHGATE_DASHBOARD_DATABASE_URL: postgresql://watchgate:watchgate@postgres:5432/watchgate_dashboard
      WATCHGATE_DATABASE_URL: postgresql+psycopg://watchgate:watchgate@postgres:5432/watchgate
      WATCHGATE_DASHBOARD_CORS_ORIGINS: http://localhost:5173
      WATCHGATE_DASHBOARD_FRONTEND_ORIGIN: http://localhost:5173
      # Rate limiting de login compartido -- ver watchgate/dashboard/backend/auth.py.
      # Con una sola réplica (este compose) no hace falta, pero así queda
      # probado en local contra un Redis real, no solo contra fakeredis en
      # los tests unitarios.
      WATCHGATE_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "8000:8000"

  dashboard-worker:
    build:
      context: .
      dockerfile: docker/dashboard-backend.Dockerfile
    # --worker-ttl 3600 (default RQ: 420s/7min) -- un repo grande con LLM
    # local puede tardar bastante más de 7 minutos en indexar su mapa de
    # conocimiento (core/repo_graph.py); con el default, el registro del
    # worker en Redis expiraba a mitad de un job real y el barrido de
    # mantenimiento lo marcaba "abandonado" (AbandonedJobError, reproducido
    # en vivo contra un repo de 232 ficheros) aunque el contenedor seguía
    # vivo y trabajando de verdad.
    command: rq worker --url redis://redis:6379/0 --worker-ttl 3600
    env_file:
      - .env
    environment:
      WATCHGATE_DASHBOARD_DATABASE_URL: postgresql://watchgate:watchgate@postgres:5432/watchgate_dashboard
      WATCHGATE_DATABASE_URL: postgresql+psycopg://watchgate:watchgate@postgres:5432/watchgate
      WATCHGATE_REDIS_URL: redis://redis:6379/0
    # Este servicio reutiliza la imagen de dashboard-backend, que trae un
    # HEALTHCHECK apuntando a http://localhost:8000/api/health -- pero aquí
    # el comando es `rq worker`, no uvicorn, así que nada escucha en ese
    # puerto. Sin este override, el contenedor se reporta perpetuamente
    # "unhealthy" aunque el worker esté consumiendo la cola con normalidad.
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      dashboard-backend:
        condition: service_started
    # 3 réplicas en paralelo (Compose V2 lo aplica también fuera de swarm,
    # sin necesidad de `docker compose up --scale`) -- con un solo worker,
    # los jobs de análisis (Semgrep recompilando su catálogo desde cero por
    # invocación, ~20-60s fijos, más las llamadas LLM de la capa semántica)
    # se procesan de uno en uno: conectar varios repos seguidos deja a los
    # últimos esperando en cola varios minutos aunque haya cores libres.
    # Sin `container_name` fijo en este servicio, ni puertos publicados en
    # el host -- escalar no choca con nada. Ajusta este número según cores
    # disponibles; no hay problema de concurrencia en Redis/RQ por tener
    # varios workers a la vez.
    deploy:
      replicas: 3

  dashboard-frontend:
    build:
      context: watchgate/dashboard/frontend
    environment:
      BACKEND_ORIGIN: http://dashboard-backend:8000
    depends_on:
      - dashboard-backend
    ports:
      - "5173:80"

volumes:
  postgres_data:
